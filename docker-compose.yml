services:
  db:
    image: postgres:15-alpine
    container_name: cevio-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-be_cevio}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: cevio-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=cevio-db
      - DB_PORT=5432
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
    depends_on:
      - db

volumes:
  postgres_data:
